%YAML:1.0 # need to specify the file type at the top!

cam:
  enabled: true
  max_n: 2                # number of cameras (cam0..cam{max_n-1})
  use_stereo: true        # track the pair jointly (stereo KLT); the pair shares ONE time offset
  stereo_pair: [0, 1]     # camera ids forming stereo pairs, flattened [a0, b0, a1, b1, ...]
  do_calib_ext: true      # estimate camera-IMU extrinsics online
  do_calib_int: true      # estimate intrinsics + distortion online
  do_calib_dt: true       # estimate camera-IMU time offset online
  n_pts: 1500             # target number of tracked KLT features per image
  fast: 30                # FAST corner threshold for new feature extraction
  grid_x: 15              # extraction grid (columns) to spread features over the image
  grid_y: 15              # extraction grid (rows)
  min_px_dist: 15         # minimum distance between features [px]
  knn: 0.65               # descriptor ratio test; unused (MINS always uses the KLT tracker)
  downsample: true        # halve the images (intrinsics/resolution below are scaled automatically)
  histogram_method: "HISTOGRAM" # NONE, HISTOGRAM, CLAHE
  max_slam: 0             # SLAM features kept in the state (0 = MSCKF only)
  max_msckf: 50           # max MSCKF features used per update
  feat_rep: "GLOBAL_FULL_INVERSE_DEPTH" # landmark parametrization (GLOBAL_3D or GLOBAL_FULL_INVERSE_DEPTH)
  init_cov_dt: 1e-4       # initial variance of the time offset [s^2]
  init_cov_ex_o: 1e-4     # initial variance of the extrinsic rotation [rad^2]
  init_cov_ex_p: 1e-4     # initial variance of the extrinsic translation [m^2]
  init_cov_in_k: 1e-2     # initial variance of fx, fy [px^2]
  init_cov_in_c: 1e-1     # initial variance of cx, cy [px^2]
  init_cov_in_r: 1e-6     # initial variance of the distortion coefficients
  sigma_px: 2             # pixel measurement noise std (on the downsampled image) [px]
  chi2_mult: 1            # multiplier of the 95% chi2 gating threshold

  # feature related (triangulation acceptance)
  fi_min_dist: 0.25       # min feature depth [m]
  fi_max_dist: 150        # max feature depth [m]
  fi_max_baseline: 2000   # max depth/baseline ratio (large = accept far, poorly-triangulated points)
  fi_max_cond_number: 10000 # max condition number of the triangulation system

  # ==================================================================
  # ==================================================================

cam0:
  timeoffset:  0.0        # initial time offset t_imu = t_cam + timeoffset [s] (shared by the pair)
  T_imu_cam: # rotation from camera to IMU R_CtoI, position of camera in IMU p_CinI
    - [ 0.03126828,  0.00639218,  0.99949059,  1.81586193]
    - [ 0.99950511,  0.00324197, -0.03128947, -0.27723510]
    - [-0.00344033,  0.99997431, -0.00628765, -0.93263362]
    - [ 0.0,         0.0,         0.0,         1.0]
  distortion_coeffs: [-0.020915965282134488, 0.03063332277912466, 0.002045867777107803, -0.003086122477800863]
  # distortion_model: radtan (k1 k2 p1 p2) or equidistant (k1..k4)
  distortion_model: radtan
  intrinsics: [718.7645387940635, 716.7417408725463, 593.8658824468442, 521.379241388709] # fx fy cx cy (full res)
  resolution: [1224, 1026] # width height (full res)
  topic: "/cam1/image_raw/compressed"
  compressed: true         # sensor_msgs/CompressedImage

cam1:
  timeoffset:  0.0        # ignored with use_stereo (overwritten by the cam0 offset)
  T_imu_cam: # rotation from camera to IMU R_CtoI, position of camera in IMU p_CinI
    - [ 0.02798703,  0.00358628,  0.99960185,  1.86323186]
    - [ 0.99952983, -0.01262870, -0.02793971,  0.25022070]
    - [ 0.01252348,  0.99991382, -0.00393803, -0.92147842]
    - [ 0.0,         0.0,         0.0,         1.0]
  distortion_coeffs: [-0.02458962682813034, 0.03272658558906052, 0.0025590396911031113, 0.001147427206994338]
  distortion_model: radtan
  intrinsics: [719.4705213043574, 717.2456646487565, 621.392121670097, 515.3163787488853]
  resolution: [1224, 1026]
  topic: "/cam5/image_raw/compressed"
  compressed: true

