%YAML:1.0 # need to specify the file type at the top!

cam:
  enabled: true
  max_n: 2
  use_stereo: false # as stereo cameras do not have the same exact tstamp
  stereo_pair: [0, 1]
  do_calib_ext: true
  do_calib_int: false
  do_calib_dt: true
  n_pts: 1500
  fast: 30
  grid_x: 15
  grid_y: 15
  min_px_dist: 15
  knn: 0.65
  downsample: true
  histogram_method: "HISTOGRAM" # NONE, HISTOGRAM, CLAHE
  max_slam: 0
  max_msckf: 50
  feat_rep: "GLOBAL_FULL_INVERSE_DEPTH"
  init_cov_dt: 1e-4
  init_cov_ex_o: 1e-4
  init_cov_ex_p: 1e-4
  init_cov_in_k: 1e-2
  init_cov_in_c: 1e-1
  init_cov_in_r: 1e-6
  sigma_px: 2
  chi2_mult: 1

  # feature related
  fi_min_dist: 0.25
  fi_max_dist: 150
  fi_max_baseline: 2000
  fi_max_cond_number: 10000

  # ==================================================================
  # ==================================================================

