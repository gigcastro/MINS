%YAML:1.0 # need to specify the file type at the top!

gps:
  enabled: true
  max_n: 2                # number of receivers (gps0..gps{max_n-1})
  do_calib_ext: false     # estimate antenna lever arms online
  do_calib_dt: false      # estimate GNSS-IMU time offsets online
  init_distance: 5.0      # path length to travel before aligning the world frame to ENU [m]
  init_closed_form: false # false = yaw from Horn method, true = 4-DOF RANSAC solution
  init_cov_dt: 5e-1       # initial variance of the time offset [s^2] (used if do_calib_dt)
  init_cov_ex: 5e-2       # initial variance of the lever arm [m^2] (used if do_calib_ext)
  init_cov_inflation: 1.0 # after the ENU alignment the WHOLE state covariance is multiplied by
                          # this. <1 deflates it and makes the filter more confident in every
                          # std (pos, ori, biases, calib); upstream configs use 2.0
  chi2_mult: 5         # multiplier of the 95% chi2 gate. 9999 = never reject, which also disables
                          # the built-in fallback (3D rejected -> retry with horizontal only)
  overwrite_noise: true  # false = use the NavSatFix covariance; `noise`/`noise_z` below are only a
                          # fallback for fixes with covariance <= 0. true = always use noise/noise_z
  noise: 0.05             # horizontal std [m] (see overwrite_noise)
  # The GNSS altitude is much worse than the horizontal fix: keep the vertical
  # solution owned by LiDAR/camera by giving the Up axis a weak weight.
  # Without noise_z the vertical std defaults to 2 * noise.
  # NOTE: NOT in effect while overwrite_noise: false. Both u-blox fix topics carry a
  # DIAGONAL_KNOWN covariance (100% of the fixes in sanisidro_0_restamp_stereo), so MINS uses
  # the per-fix values, and (NavSatFix2Data bug) takes the variance as the std: vAcc 0.42 m
  # (median) becomes sigma_z = 0.18 m. The Up axis is currently weighted STRONGLY, not weakly.
  # To make noise/noise_z effective set overwrite_noise: true AND raise `noise` (0.05 m is
  # far too tight for a standalone fix; horizontal residuals are ~1-3 m).
  noise_z: 0.5            # vertical std [m] (see overwrite_noise)

# Antenna assignment measured from the data (sanisidro_0): the ENU vector between the
# two fixes on straight segments is (-3.3, -0.3, -1.0) m in the body frame, so
# /ublox_moving_base is the REAR antenna and /ublox_rover the FRONT one. With the
# lever arms swapped the other way the filter converges to a ~160 deg yaw error
# (GPS residuals ~10 m, camera features rendered beside the car instead of ahead).
# Both fixes are standalone (NavSatFix status 0: no SBAS/RTK). Their altitudes disagree by
# 2.3..7.2 m (rover lower, median 3.9 m) although the lever arms differ by ~0.2 m in height
# and each receiver claims vAcc ~0.4 m: fused as unbiased, they pull Z between each other.
# The moving base is the more repeatable one (same-place revisits: median 0.05 m, p95 1.75 m).
gps0:
  timeoffset: -0.03       # t_imu = t_gps + timeoffset [s]
  pGinI: [-0.9, 0, -0.3]  # antenna position in the IMU frame [m] (IMU +z points DOWN)
  topic: "/ublox_moving_base/fix"

gps1:
  timeoffset: -0.03
  pGinI: [2.710104, -0.000183, -0.094153]
  topic: "/ublox_rover/fix"

