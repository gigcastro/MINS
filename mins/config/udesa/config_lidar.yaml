%YAML:1.0 # need to specify the file type at the top!

# Verified on sanisidro_0_restamp (2026-09-17): 1.2M point updates, 99% chi2 acceptance,
# lidar dt calibrates to -0.003 s. NOTE: full fusion costs ~54-63 ms/scan -> ~0.9x real
# time on the lab machine, so play bags at `ros2 bag play -r 0.5` (or relax
# raw_downsample_size / map_downsample_size / max_range for live 1x operation).
lidar:
  enabled: true
  max_n: 1
  do_calib_dt: true
  do_calib_ext: true
  init_cov_dt: 1e-1
  init_cov_ex_o: 1e-3
  init_cov_ex_p: 1e-3
  max_range: 30.0
  min_range: 1
  chi2_mult: 1
  raw_do_downsample: true
  raw_downsample_size: 2.0
  raw_noise: 0.1
  raw_remove_motion_blur: false # required to set v_angles and h_angles correctly
  raw_point_dt: 1e-6
  map_do_downsample: true
  map_downsample_size: 0.5
  map_noise: 0.1
  map_ngbr_num: 5
  map_ngbr_max_d: 10.0
  map_decay_time: 30 # sec
  map_decay_dist: 30 # m
  map_use_icp: false
  map_icp_dist: 30 # m
  plane_max_p2pd: 0.1
  plane_max_condi: 200.0

lidar0:
  timeoffset: -0.0
  T_imu_lidar:
    - [ 0.999852, -0.017094,  0.002137,  1.366716]
    - [-0.017089, -0.999851, -0.002260,  0.013061]
    - [ 0.002175,  0.002223, -0.999995, -0.987373]
    - [ 0.0,       0.0,       0.0,       1.0]
  topic: "/velodyne_points"

