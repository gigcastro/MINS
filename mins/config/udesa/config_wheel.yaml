%YAML:1.0 # need to specify the file type at the top!

# Wheel odometry from the REAR wheel speeds of the dataspeed bus (2017 Ford Fusion, FWD:
# the front wheels drive and spin ~2 % faster under traction). MINS expects
# sensor_msgs/JointState; scripts/wheel_report_to_jointstate.py converts
# /vehicle/wheel_speed_report (dbw_mkz WheelSpeedReport, rad/s, 100 Hz) into the
# /wheel/joint_states bag next to the restamped imu_gps/cameras bags of every split.
# A 3D type adds a non-holonomic constraint (no lateral/vertical body velocity)
# that strongly limits vertical drift on slopes.
wheel:
  enabled: true
  type: "Wheel3DAng" #  Wheel2DAng, Wheel2DLin, Wheel2DCen, Wheel3DAng, Wheel3DLin, Wheel3DCen
                     #  2D/3D = planar or full motion model; Ang = wheel angular rates,
                     #  Lin = wheel linear speeds, Cen = body-center linear/angular speed
  do_calib_dt: true       # estimate wheel-IMU time offset online (the CAN bus lags ~20 ms, see timeoffset)
  do_calib_ext: false     # estimate wheel-IMU extrinsic online
  do_calib_int: false     # estimate wheel radii + base length online (Ang types only)
  noise_w: 0.2            # measurement noise of the angular velocity
  noise_v: 0.5            # measurement noise of the linear velocity
  noise_p: 0.1            # noise of the unmeasured (out-of-plane / lateral) motion in 3D types
  init_cov_dt: 1e-4       # initial variance of the time offset [s^2]
  init_cov_ex_o: 1e-4     # initial variance of the extrinsic rotation [rad^2]
  init_cov_ex_p: 1e-3     # initial variance of the extrinsic translation [m^2]
  init_cov_in_b: 1e-3     # initial variance of the base length [m^2]
  init_cov_in_r: 1e-3     # initial variance of the wheel radii [m^2]
  chi2_mult: 15           # multiplier of the 95% chi2 gating threshold
  # The dataspeed bus stamps ~20 ms late (the vehicle IMU on the same bus lags /imu/data by
  # +20 ms in imutime's cross-check). With the offset pinned at 0 the filter dragged the
  # camera offset to -40 ms instead; -0.02 + do_calib_dt converges to ~+0.01..0.02.
  timeoffset: -0.02       # initial time offset t_imu = t_wheel + timeoffset [s]
  # Rolling radius measured on loop_sanisidro split_01 as twist.linear.x / wheel rate:
  # rear 0.329 m (front 0.323 m); 235/45 R18 is 0.334 m unloaded. Base length = rear track
  # of the 2017 Fusion, 62.1 in = 1.577 m (the front track is 62.3 in); the value recovered
  # from the bus yaw rate is 1.49 m (noisy), so keep the published one.
  intrinsics: [0.329, 0.329, 1.577] # left radius, right radius, base length [m]
  reuse_of_information: false # reuse wheel data already used in the IMU-wheel initializer
  # Odometry frame O = the vehicle base_link of extrinsecas.launch: rear axle centre at hub
  # height, x forward, y left, z up (MINS: w = (m2*rr - m1*rl)/b, so +z is up when the right
  # wheel is m2). base_link sits at the rear axle: wheel_fl_ext is at x = 2.869 m in it and
  # the wheelbase is 112.2 in = 2.850 m. The IMU pose in base_link is the launch chain
  # base_link -> lidar -> imu (IMU +z points DOWN, ~180 deg about x); inverted:
  T_imu_wheel:            # R_OtoI and p_OinI (wheel-odometry frame in the IMU frame)
    - [ 0.998802,  0.048004, -0.009474, -0.172431]
    - [ 0.048161, -0.998694,  0.017046, -0.051689]
    - [-0.008644, -0.017482, -0.999810,  0.619332]
    - [ 0.0,       0.0,       0.0,       1.0]
  topic: "/wheel/joint_states"
  sub_topics: "rear_left_wheel_joint, rear_right_wheel_joint" # JointState names: m1 = left, m2 = right
# Measured on the first 5 min of loop_sanisidro split_01 (1 km), rms error vs the RTK track:
#   GNSS off (dead reckoning, after yaw alignment): wheel 3.4 m / z 5 m   vs no wheel 13 m / z 21 m
#   GNSS on (chi2 gate off):                       wheel 4.2 m / z 0.6 m vs no wheel 2.8 m / z 1.1 m
# Online extrinsic calibration (do_calib_ext) moved p_OinI by ~1 cm and changed nothing else.
